name: build-and-push-bskyweb-flyio

on:
  # Production deploy only. Do not add pull_request or workflow_dispatch;
  # those would deploy from a PR or a manual click.
  push:
    branches: [release]

# Newer release pushes cancel an in-progress deploy so an older SHA cannot
# finish last.
concurrency:
  group: production-deployment
  cancel-in-progress: true

# Deploy authenticates with FLY_API_TOKEN, not github.token. Read is enough
# for checkout.
permissions:
  contents: read

jobs:
  pre-deployment:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile i18n
        run: pnpm intl:build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build test
        run: pnpm build-web

  deploy:
    name: Deploy to Fly.io
    needs: pre-deployment
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Fly.io CLI
        env:
          # Pin both version and sha256. Bumping requires updating both from
          # https://github.com/superfly/flyctl/releases (Linux x86_64 tarball).
          FLYCTL_VERSION: "0.4.102"
          FLYCTL_SHA256: "94a7219201660d57705d6f92fc4a75199aa0c491c349325fd67dca0b43bc588e"
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            echo "Unsupported runner architecture: $arch (expected x86_64)"
            exit 1
          fi
          tarball="flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          url="https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/${tarball}"
          curl -fsSL -o "$tarball" "$url"
          echo "${FLYCTL_SHA256}  ${tarball}" | sha256sum --strict -c -
          bin_dir="$HOME/.fly/bin"
          mkdir -p "$bin_dir"
          tar -xzf "$tarball" -C "$bin_dir" flyctl
          chmod +x "$bin_dir/flyctl"
          ln -sfn "$bin_dir/flyctl" "$bin_dir/fly"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/flyctl" version

      - name: Deploy to Fly.io
        run: |
          fly deploy \
            --build-arg EXPO_PUBLIC_ENV=production \
            --build-arg EXPO_PUBLIC_RELEASE_VERSION=$(node -p "require('./package.json').version") \
            --build-arg EXPO_PUBLIC_BUNDLE_IDENTIFIER=bluenotes-production \
            --build-arg EXPO_PUBLIC_CHAT_PROXY_DID=did:web:api.bsky.chat \
            --build-arg EXPO_PUBLIC_BLUESKY_PROXY_DID=did:web:api.bsky.app \
            --build-arg EXPO_PUBLIC_SENTRY_DSN= \
            --env ATP_APPVIEW_HOST=https://public.api.bsky.app \
            --env OGCARD_HOST=https://ogcard.cdn.bsky.app \
            --env LINK_HOST= \
            --env DEBUG=false \
            --env DOMAIN=bluenotes.social \
            --env CORS_ALLOWED_ORIGINS=https://bluenotes.social,https://www.bluenotes.social,https://bluenotes-web.fly.dev \
            --env STATIC_CDN_HOST= \
            --env BSKY_CANONICAL_INSTANCE=false \
            --env ROBOTS_DISALLOW_ALL=false \
            --env GOLOG_LOG_LEVEL=info \
            --env GEOLOCATION_URL=/ipcc \
            --remote-only \
            --strategy canary
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  post-deployment:
    name: Post-Deployment Validation
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Health check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://bluenotes.social/)
          if [ "$response" != "200" ]; then
            echo "Health check failed with status code: $response"
            exit 1
          fi
          echo "Health check passed (HTTP $response)"

      - name: Deployment notification
        run: |
          echo "✅ Successfully deployed to https://bluenotes.social/"
          echo "Version: $(node -p 'require("./package.json").version')" || echo "Version: unknown"
