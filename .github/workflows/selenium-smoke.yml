# Community Notes Selenium smoke.
# Default PR job is offline assertions only (no Chrome, no live app).
# Live product smoke needs a browser + BASE_URL and is workflow_dispatch.
# Maestro (__e2e__) and Jest are unchanged.
name: Selenium CN smoke

on:
  pull_request:
    paths:
      - 'selenium/**'
      - 'scripts/run-selenium.sh'
      - '.github/workflows/selenium-smoke.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Live BASE_URL (empty = assertions only)'
        required: false
        default: ''

jobs:
  assertions:
    name: Offline chrome-only assertions
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run assertion tests
        run: ./scripts/run-selenium.sh selenium/test_assertions.py

  live:
    name: Live web smoke
    if: github.event_name == 'workflow_dispatch' && inputs.base_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Run live Selenium smoke
        env:
          BASE_URL: ${{ inputs.base_url }}
          SELENIUM_HEADLESS: '1'
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: ./scripts/run-selenium.sh
