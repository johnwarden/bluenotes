app = "bluenotes-web"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  # Disable automatic retries to save time on failed builds
  auto_retry = false
  # Set reasonable timeout
  build-timeout = "30m"

[env]
  # HTTP_ADDRESS must match internal_port and be hardcoded here
  HTTP_ADDRESS = ":8100"

[http_service]
  internal_port = 8100
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# All other environment variables are passed via justfile deploy command using --env
# Secrets are managed via fly secrets set
# No persistent storage needed initially