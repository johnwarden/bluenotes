<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="theme-color">
    <!--
      This viewport works for phones with notches.
      It's optimized for gestures by disabling global zoom.
     -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover"
    />
    <!--
      Preconnect to essential domains
    -->
    <link rel="preconnect" href="https://bsky.social">
    <link rel="preconnect" href="https://go.bsky.app">
    <link rel="preconnect" href="https://bluenotes.social">
    <title>%WEB_TITLE%</title>

    <link rel="preload" as="font" type="font/woff2" href="/static/media/InterVariable.c504db5c06caaf7cdfba.woff2" crossorigin>

    <style>
      /**
       * Minimum styles required to render splash.
       *
       * ALL OTHER STYLES BELONG IN `src/style.css`
       *
       * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
       */
      @font-face {
        font-family: 'InterVariable';
        src: url(/static/media/InterVariable.c504db5c06caaf7cdfba.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'InterVariableItalic';
        src: url(/static/media/InterVariable-Italic.01dcbad1bac635f9c9cd.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: italic;
        font-display: swap;
      }
      html {
        background-color: white;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: black;
        }
      }
      html,
      body {
        margin: 0px;
        padding: 0px;
        font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
        text-rendering: optimizeLegibility;
        /* Platform-specific reset */
        -webkit-overflow-scrolling: touch;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
        font-synthesis-weight: none;
      }
      html,
      body,
      #root {
        display: flex;
        flex: 1 0 auto;
        min-height: 100%;
        width: 100%;
      }
      #splash {
        position: fixed;
        width: 100px;
        left: 50%;
        top: 50%;
        transform: translateX(-50%) translateY(-50%) translateY(-50px);
      }
      /**
       * We need these styles to prevent shifting due to scrollbar show/hide on
       * OSs that have them enabled by default. This also handles cases where the
       * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
       * shift the content, by forcing the page to show a scrollbar.
       */
      body {
        width: 100%;
        overflow-y: scroll;
      }
    </style>
  </head>

  <body>
    <!--
      A generic no script element with a reload button and a message.
      Feel free to customize this however you'd like.
    -->
    <noscript>
      <form
        action=""
        style="
          background-color: #fff;
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 9999;
        "
      >
        <div
          style="
            font-size: 18px;
            font-family: Helvetica, sans-serif;
            line-height: 24px;
            margin: 10%;
            width: 80%;
          "
        >
          <p lang="en">Oh no! It looks like JavaScript is not enabled in your browser.</p>
          <p lang="en" style="margin: 20px 0;">
            <button
              type="submit"
              style="
                background-color: #4630eb;
                border-radius: 100px;
                border: none;
                box-shadow: none;
                color: #fff;
                cursor: pointer;
                font-weight: bold;
                line-height: 20px;
                padding: 6px 16px;
              "
            >
              Reload
            </button>
          </p>
        </div>
      </form>
    </noscript>

    <!-- The root element for your Expo app. -->
    <div id="root">
      <div id="splash">
        <!-- Bluesky SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501.369 438.92"><path fill="#0085ff" d="M189.026.943c-12 6-11 1-11 102 0 89 0 89-5 89-22-3-53-2-69 2-10 2-13 3-17 5-2 1-5 2-7 3-8 2-20 8-31 15-56 38-65 96-21 130 3 2 20 11 22 11 0 0 2 0 3 1 12 6 47 8 69 3 2 0 6-1 8-2 1 0 3-1 5-1 1 0 3-1 6-2 24-7 64-37 74-55 1-1 3-3 4-6 3-4 8-13 10-18 2-6 3-8 4-12 1-2 2-6 2-7 2-8 3-37 3-99 0-64 0-64 8-62 5 1 11 2 14 3s12 3 21 5c16 3 40 8 48 10 2 0 9 2 14 3s12 3 15 3c2 1 6 2 9 2 2 1 6 1 9 2 2 0 6 1 9 2 2 1 6 2 9 2 3 1 7 2 10 2 2 1 6 1 9 2 6 1 12 3 18 4 4 1 7 1 13 3 2 0 2 0 2 66s0 66-3 66c-1-1-6-2-10-3-15-3-45-2-61 3-3 1-7 2-8 2-8 2-17 5-24 8-4 2-7 4-8 4 0 0-2 1-4 3-3 2-5 3-5 3-5 0-33 26-40 37-15 21-18 50-8 70 3 6 17 22 19 22 1 0 2 1 4 2 5 3 23 11 29 12 3 1 7 2 8 2 4 1 43 1 48 0 2 0 6-1 10-2 54-11 94-49 106-102 3-13 3-257 0-263-5-9-14-16-25-18l-20-4c-7-1-14-3-21-4l-20-4c-2 0-7-1-10-2-8-1-14-2-20-4-6-1-14-3-19-4-9-2-20-4-30-6-6-1-12-3-20-4-3-1-7-1-9-2-3 0-9-2-15-3s-14-3-18-4c-5-1-11-2-15-3-7-1-13-2-20-4-3-1-7-1-9-2-3 0-8-1-10-2-6-1-27-1-29 0z"/></svg>
      </div>
    </div>
  </body>
</html>
